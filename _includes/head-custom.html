<style>
  .highlight, .language-plaintext.highlighter-rouge { position: relative; }
  .copy-btn {
    position: absolute; top: 6px; right: 6px;
    font-size: 12px; padding: 3px 8px; cursor: pointer;
    border: 1px solid #bbb; border-radius: 4px; background: #fff; color: #333;
    opacity: .75;
  }
  .copy-btn:hover { opacity: 1; }
  .copy-btn.done { background: #159957; color: #fff; border-color: #159957; }

  /* ── 교시 네비게이션 바 ─────────────────────────── */
  #lab-nav {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #155799;
    border-bottom: 3px solid #159957;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    padding: 0 1.2rem;
    gap: 0;
  }
  #lab-nav a {
    color: rgba(255,255,255,.8);
    text-decoration: none;
    padding: .55rem .85rem;
    font-size: .82rem;
    font-weight: 500;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    margin-bottom: -3px;
    transition: color .15s, border-color .15s, background .15s;
    line-height: 1.6;
  }
  #lab-nav a:hover {
    color: #fff;
    border-bottom-color: rgba(255,255,255,.6);
    background: rgba(255,255,255,.08);
  }
  #lab-nav a.nav-active {
    color: #fff;
    border-bottom-color: #fff;
    background: rgba(255,255,255,.15);
  }
  #lab-nav .nav-sep {
    color: rgba(255,255,255,.3);
    padding: 0 .1rem;
    user-select: none;
    font-size: .75rem;
  }
  @media (max-width: 600px) {
    #lab-nav { padding: 0 .5rem; }
    #lab-nav a { padding: .45rem .55rem; font-size: .75rem; }
    #lab-nav .nav-sep { display: none; }
  }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {

  /* ── 네비게이션 바 삽입 ─────────────────────────── */
  /* 현재 위치가 /labs/ 하위인지 판단해 base 경로 결정 */
  var inLabs = window.location.pathname.indexOf('/labs/') !== -1;
  var base   = inLabs ? '../' : './';

  var labs = [
    { label: '🏠 목록',  href: base },
    { label: '1교시',    href: base + 'labs/lab1-first-workflow.html' },
    { label: '2교시',    href: base + 'labs/lab2-structure-ui.html' },
    { label: '3교시',    href: base + 'labs/lab3-pipeline-artifacts.html' },
    { label: '4교시',    href: base + 'labs/lab4-secrets-security.html' },
    { label: '5교시',    href: base + 'labs/lab5-reuse-standardize.html' },
    { label: '6교시',    href: base + 'labs/lab6-runners-migration.html' },
    { label: '7교시',    href: base + 'labs/lab7-migration-workshop.html' }
  ];

  /* 현재 경로와 비교해 active 판정 */
  var curPath = window.location.pathname.replace(/\/$/, '');

  var nav = document.createElement('nav');
  nav.id = 'lab-nav';
  nav.setAttribute('aria-label', '교시 목록');

  labs.forEach(function (item, i) {
    if (i > 0) {
      var sep = document.createElement('span');
      sep.className = 'nav-sep';
      sep.textContent = '|';
      nav.appendChild(sep);
    }
    var a = document.createElement('a');
    a.href   = item.href;
    a.textContent = item.label;

    /* href → 절대 경로로 변환해 비교 */
    var tmp = document.createElement('a');
    tmp.href = item.href;
    var targetPath = tmp.pathname.replace(/\/$/, '');
    if (curPath === targetPath ||
        (item.label === '🏠 목록' && (curPath.endsWith('/actions-lab') || curPath === ''))) {
      a.classList.add('nav-active');
      a.setAttribute('aria-current', 'page');
    }
    nav.appendChild(a);
  });

  /* .page-header 바로 뒤에 삽입; 없으면 body 첫 자식으로 */
  var header = document.querySelector('.page-header');
  if (header && header.parentNode) {
    header.parentNode.insertBefore(nav, header.nextSibling);
  } else {
    document.body.insertBefore(nav, document.body.firstChild);
  }

  /* ── 코드 블록 복사 버튼 ───────────────────────── */
  document.querySelectorAll('pre').forEach(function (pre) {
    var wrap = pre.closest('.highlight') || pre.parentElement;
    wrap.style.position = 'relative';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy-btn';
    btn.textContent = '📋 복사';
    btn.addEventListener('click', function () {
      var code = pre.querySelector('code') || pre;
      navigator.clipboard.writeText(code.innerText.replace(/\n$/, '')).then(function () {
        btn.textContent = '✅ 복사됨';
        btn.classList.add('done');
        setTimeout(function () { btn.textContent = '📋 복사'; btn.classList.remove('done'); }, 1500);
      });
    });
    wrap.appendChild(btn);
  });
});
</script>
